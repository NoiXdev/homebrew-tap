name: Bump

# Called by a product's release workflow after it has published an asset.
# Rewrites the url and the checksum, because the formulae here carry no
# version field — Homebrew derives the version from the url.
on:
  workflow_dispatch:
    inputs:
      kind:
        description: formula or cask
        required: true
        type: choice
        options: [formula, cask]
      name:
        description: file name without .rb
        required: true
      version:
        description: without a leading v
        required: true
      sha256:
        description: checksum of the release asset
        required: true

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Rewrite the version and checksum
        run: |
          set -euo pipefail
          if [ "${{ inputs.kind }}" = cask ]; then dir=Casks; else dir=Formula; fi
          file="$dir/${{ inputs.name }}.rb"
          test -f "$file" || { echo "no such file: $file" >&2; exit 1; }

          # The two kinds are bumped differently, and getting this wrong is
          # silent: a cask carries a `version` field and interpolates it into
          # its url, so rewriting the url text would leave the version behind
          # and vice versa. A formula has no version field at all — Homebrew
          # derives it from the url — so there the url is the only place.
          if [ "$dir" = Casks ]; then
            grep -q '^  version ' "$file" || {
              echo "$file has no version field; casks are expected to carry one" >&2
              exit 1
            }
            sed -i 's|^  version ".*"|  version "${{ inputs.version }}"|' "$file"
          else
            old=$(grep -oE 'download/v[^/]+/' "$file" | head -1 | sed 's|download/v||;s|/||')
            test -n "$old" || { echo "cannot read the current version from $file" >&2; exit 1; }
            sed -i "s|/v$old/|/v${{ inputs.version }}/|g; s|-v$old-|-v${{ inputs.version }}-|g" "$file"
          fi

          sed -i 's|sha256 ".*"|sha256 "${{ inputs.sha256 }}"|' "$file"

          # Matched as a path segment, not as text anywhere in the file.
          # Promoting 1.0.0-beta.1 to 1.0.0 is the case that breaks a plain
          # substring check: "1.0.0" is already inside "1.0.0-beta.1", so a
          # sed that silently did nothing would still pass.
          if [ "$dir" = Casks ]; then
            grep -q "^  version \"${{ inputs.version }}\"" "$file" || {
              echo "nothing changed — the bump would have been a no-op" >&2
              exit 1
            }
          else
            grep -q "/v${{ inputs.version }}/" "$file" || {
              echo "nothing changed — the bump would have been a no-op" >&2
              exit 1
            }
          fi
          grep -q "sha256 \"${{ inputs.sha256 }}\"" "$file" || {
            echo "the checksum was not written" >&2
            exit 1
          }
          git diff --stat

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(${{ inputs.name }}): ${{ inputs.version }}"
          git push
